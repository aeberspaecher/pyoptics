[build-system]
requires = ["setuptools>=64", "wheel", "Cython>=3.0", "numpy>=1.25"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoptics"
version = "0.1.0"
description = "Tools for wave optical simulation: imaging, wave propagation, thin films and more."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Alexander Eberspächer" }]
dependencies = [
    "numpy",
    "scipy>=1.4",  # scipy.fft (workers argument)
]

[project.optional-dependencies]
plot = ["matplotlib"]
nufft = ["finufft"]  # tilted: faster exact propagation onto planes tilted about a general axis
tie = ["sympy"]
notebooks = ["matplotlib", "jupyterlab", "ipywidgets"]
docs = ["sphinx>=7", "furo", "numpydoc", "myst-nb", "sphinx-copybutton", "matplotlib"]  # matplotlib: plot modules
test = ["pytest", "matplotlib", "sympy"]  # matplotlib: plot_tools, masks.mask_from_polygon; sympy: TIE.smoothed_deriv

[project.urls]
Homepage = "https://github.com/aeberspaecher/pyoptics"
Documentation = "https://aeberspaecher.github.io/pyoptics/"

[tool.setuptools.packages.find]
include = ["pyoptics*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyx", "*.c"]

# Docstring checks (numpydoc lint, run by the docs workflow, report-only for now):
# missing docstrings, undocumented or unknown parameters and missing Returns.
# Section-name checks (GL06/GL07) are left out because module docstrings use
# their own section titles. Private objects are excluded.
[tool.numpydoc_validation]
checks = ["GL08", "PR01", "PR02", "PR03", "PR10", "RT01"]
exclude = ['\._']
