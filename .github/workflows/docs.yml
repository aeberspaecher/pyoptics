name: docs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pyoptics with docs extras
        run: python -m pip install -e ".[docs]"
      - name: Build HTML (warnings are errors)
        run: python -m sphinx -b html -W --keep-going docs docs/_build/html
      # Report-only for now: lists docstring gaps (config in pyproject.toml)
      # without failing the build.
      - name: Docstring check (numpydoc lint, report-only)
        continue-on-error: true
        run: |
          python -W ignore -m numpydoc lint $(git ls-files 'pyoptics/*.py') > numpydoc.log 2>&1 || status=$?
          grep -v '^$' numpydoc.log || true
          {
            echo "### numpydoc lint"
            echo '```'
            grep -oE ' (GL08|PR0[0-9]|PR10|RT01) ' numpydoc.log | sort | uniq -c || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit ${status:-0}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
