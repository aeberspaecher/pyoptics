name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # ubuntu-latest (26.04) has no Python 3.9 in setup-python
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
        # the NumPy ray trace on 3.9 and 3.11, the numba kernel on 3.13
        include:
          - python-version: "3.13"
            extras: ",fast"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pyoptics with test extras
        run: python -m pip install -e ".[test${{ matrix.extras }}]"
      - name: Run tests
        run: python -m pytest -v test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check for syntax errors and undefined names
        run: |
          python -m pip install ruff
          ruff check --select E9,F63,F7,F82 pyoptics test
